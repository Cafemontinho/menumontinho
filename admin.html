<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Montinho · Gestão do Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Cinzel:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#161310;
    --charcoal-2:#1f1b16;
    --panel:#211c16;
    --gold:#c8a768;
    --gold-soft:#e3d2ab;
    --cream:#efe8d8;
    --line: rgba(200,167,104,0.25);
    --green:#6fae7a;
    --red:#e05a5a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    min-height:100vh;
    padding:0 0 4rem;
  }
  header{
    text-align:center;
    padding:3.2rem 6vw 2rem;
    background:radial-gradient(circle at 50% 0%, rgba(200,167,104,0.08), transparent 60%);
  }
  .eyebrow{
    font-size:.68rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.85;
    margin-bottom:.8rem;
  }
  h1{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:clamp(1.6rem,4.5vw,2.4rem);
    color:var(--gold-soft);
    margin:0 0 .4rem;
  }
  .subtitle{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.05rem;
    color:rgba(239,232,216,0.6);
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:0 6vw;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:1.6rem 1.6rem 1.8rem;
    margin-bottom:1.6rem;
  }
  .panel h2{
    font-family:'Cinzel',serif;
    font-size:.85rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 1.2rem;
  }

  label{
    display:block;
    font-size:.75rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:rgba(239,232,216,0.55);
    margin-bottom:.35rem;
  }
  input[type=text],input[type=password]{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    font-size:.9rem;
    padding:.7rem .8rem;
    border-radius:4px;
    margin-bottom:1rem;
    outline:none;
  }
  input[type=text]:focus,input[type=password]:focus{border-color:var(--gold);}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  @media(max-width:560px){.field-row{grid-template-columns:1fr;}}

  .checkbox-row{
    display:flex;
    align-items:flex-start;
    gap:.6rem;
    margin:-.3rem 0 1.2rem;
    font-size:.8rem;
    color:rgba(239,232,216,0.6);
    line-height:1.5;
  }
  .checkbox-row input{margin-top:.2rem;}

  button{
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:.85rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold-soft);
    padding:.75rem 1.6rem;
    border-radius:4px;
    cursor:pointer;
    transition:all .2s ease;
  }
  button:hover:not(:disabled){background:rgba(200,167,104,0.12);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--gold);color:var(--charcoal-2);font-weight:600;}
  button.primary:hover:not(:disabled){background:var(--gold-soft);}

  .status-msg{
    font-size:.82rem;
    padding:.7rem .9rem;
    border-radius:4px;
    margin-top:1rem;
    display:none;
  }
  .status-msg.show{display:block;}
  .status-msg.error{background:rgba(224,90,90,0.12);color:#f0a3a3;border:1px solid rgba(224,90,90,0.35);}
  .status-msg.success{background:rgba(111,174,122,0.12);color:#a9d6b1;border:1px solid rgba(111,174,122,0.35);}
  .status-msg.info{background:rgba(200,167,104,0.1);color:var(--gold-soft);border:1px solid var(--line);}

  /* ---------- LISTA DE ITENS ---------- */
  #itemsPanel{display:none;}
  .category{margin-bottom:1.8rem;}
  .category:last-child{margin-bottom:0;}
  .category-title{
    font-family:'Cinzel',serif;
    font-size:.78rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    border-bottom:1px solid var(--line);
    padding-bottom:.6rem;
    margin-bottom:.8rem;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:.7rem 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .item-row:last-child{border-bottom:none;}
  .item-label{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--cream);
  }

  /* toggle switch */
  .switch{
    position:relative;
    width:46px;
    height:26px;
    flex-shrink:0;
  }
  .switch input{
    opacity:0;
    width:0;
    height:0;
  }
  .slider{
    position:absolute;
    cursor:pointer;
    top:0;left:0;right:0;bottom:0;
    background:rgba(224,90,90,0.35);
    border:1px solid rgba(224,90,90,0.5);
    border-radius:999px;
    transition:.2s;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:18px;width:18px;
    left:3px;top:3px;
    background:#f0a3a3;
    border-radius:50%;
    transition:.2s;
  }
  .switch input:checked + .slider{
    background:rgba(111,174,122,0.35);
    border-color:rgba(111,174,122,0.6);
  }
  .switch input:checked + .slider:before{
    transform:translateX(20px);
    background:#a9d6b1;
  }
  .avail-label{
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    width:78px;
    text-align:right;
    color:rgba(239,232,216,0.45);
  }
  .item-row.is-available .avail-label{color:var(--green);}
  .item-row.is-unavailable .avail-label{color:var(--red);}

  .save-bar{
    position:sticky;
    bottom:0;
    display:flex;
    justify-content:flex-end;
    gap:.8rem;
    padding:1.2rem 0 0;
    margin-top:.5rem;
  }

  .hint{
    font-size:.75rem;
    color:rgba(239,232,216,0.4);
    margin-top:.4rem;
    line-height:1.5;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Café Montinho</div>
  <h1>Gestão de Disponibilidade</h1>
  <div class="subtitle">Marca os itens esgotados ou disponíveis</div>
</header>

<main>

  <div class="panel" id="authPanel">
    <h2>Ligação ao GitHub</h2>

    <label for="token">Token de acesso (Personal Access Token)</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">

    <div class="field-row">
      <div>
        <label for="owner">Organização / utilizador</label>
        <input type="text" id="owner" value="Cafemontinho">
      </div>
      <div>
        <label for="repo">Repositório</label>
        <input type="text" id="repo" value="menumontinho">
      </div>
    </div>

    <div class="field-row">
      <div>
        <label for="branch">Branch</label>
        <input type="text" id="branch" value="main">
      </div>
      <div>
        <label for="path">Ficheiro</label>
        <input type="text" id="path" value="menu-status.json">
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="rememberToken">
      <label for="rememberToken" style="margin:0;text-transform:none;letter-spacing:normal;font-size:.8rem;">
        Guardar o token neste dispositivo (só usar em telemóvel/computador de confiança — fica gravado no browser)
      </label>
    </div>

    <button class="primary" id="loadBtn" onclick="loadStatus()">Carregar menu</button>
    <div class="hint">O token precisa de acesso "Contents: Read and write" apenas a este repositório (fine-grained PAT).</div>

    <div id="authStatus" class="status-msg"></div>
  </div>

  <div class="panel" id="itemsPanel">
    <h2>Itens do Menu</h2>
    <div id="itemsList"></div>

    <div class="save-bar">
      <button onclick="loadStatus()">Recarregar</button>
      <button class="primary" id="saveBtn" onclick="saveStatus()">Guardar alterações</button>
    </div>
    <div id="saveStatus" class="status-msg"></div>
  </div>

</main>

<script>
  // ---------- CATÁLOGO DE ITENS (id -> nome + categoria) ----------
  // Se adicionares/removeres itens no index.html, atualiza aqui também.
  const CATALOG = [
    { cat: 'Petiscos · Snacks', items: [
      ['f-pasteis-de-bacalhau', 'Pastéis de Bacalhau'],
      ['f-asas-de-frango', 'Asas de Frango'],
      ['f-moelas', 'Moelas'],
      ['f-rissois-de-carne', 'Rissóis de Carne'],
      ['f-rissois-de-camarao', 'Rissóis de Camarão'],
      ['f-rissois-de-atum', 'Rissóis de Atum'],
      ['f-rissois-de-leitao', 'Rissóis de Leitão'],
      ['f-cachorrinhos', 'Cachorrinhos'],
      ['f-ovo-a-montinho', 'Ovo à Montinho'],
      ['f-salada-mista', 'Salada Mista'],
      ['f-dose-de-batatas-fritas', 'Dose de Batatas Fritas'],
    ]},
    { cat: 'Pratos Principais · Mains', items: [
      ['f-francesinha', 'Francesinha'],
      ['f-hamburguer-simples', 'Hambúrguer Simples'],
      ['f-hamburguer-montinho', 'Hambúrguer Montinho'],
      ['f-cachorro-simples', 'Cachorro Simples'],
      ['f-cachorro-especial', 'Cachorro Especial'],
      ['f-prego-no-pao', 'Prego no Pão'],
      ['f-prego-no-prato-montinho', 'Prego no Prato Montinho'],
      ['f-ovos-rotos-montinho', 'Ovos Rotos Montinho'],
      ['f-batatas-a-montinho', 'Batatas à Montinho'],
      ['f-omeletes', 'Omeletes'],
    ]},
    { cat: 'Vinhos', items: [
      ['v-monte-da-vaqueira', 'Monte da Vaqueira'],
      ['v-encostas-do-cartaxo-tinto', 'Encostas do Cartaxo Tinto'],
      ['v-cadao-reserva', 'Cadão Reserva'],
      ['v-piano-branco', 'Piano Branco'],
      ['v-monte-de-pinheiros-tinto', 'Monte de Pinheiros Tinto'],
      ['v-3-amigos-branco', '3 Amigos Branco'],
      ['v-esteva-tinto', 'Esteva Tinto'],
      ['v-ponte-da-barca-grande-escolha', 'Ponte da Barca Grande Escolha'],
      ['v-ponte-da-barca', 'Ponte da Barca'],
      ['v-ponte-da-barca-vinhao', 'Ponte da Barca Vinhão'],
      ['v-muralhas-branco', 'Muralhas Branco'],
      ['v-provan-branco', 'Provan Branco'],
      ['v-conde-vilar-branco', 'Conde Vilar Branco'],
      ['v-solar-de-serrade-branco', 'Solar de Serrade Branco'],
      ['v-encostas-do-bairro', 'Encostas do Bairro'],
    ]},
  ];

  const REMEMBER_KEY = 'montinho_admin_token';
  let currentSha = null;
  let currentStatus = {};

  // pré-preencher token se estiver guardado neste dispositivo
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(REMEMBER_KEY);
    if (saved) {
      document.getElementById('token').value = saved;
      document.getElementById('rememberToken').checked = true;
    }
  });

  function cfg(){
    return {
      token: document.getElementById('token').value.trim(),
      owner: document.getElementById('owner').value.trim(),
      repo: document.getElementById('repo').value.trim(),
      branch: document.getElementById('branch').value.trim() || 'main',
      path: document.getElementById('path').value.trim() || 'menu-status.json',
    };
  }

  function showMsg(elId, type, text){
    const el = document.getElementById(elId);
    el.className = 'status-msg show ' + type;
    el.textContent = text;
  }
  function hideMsg(elId){
    document.getElementById(elId).className = 'status-msg';
  }

  function b64DecodeUtf8(b64){
    const bin = atob(b64.replace(/\n/g, ''));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }
  function b64EncodeUtf8(str){
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }

  async function loadStatus(){
    const { token, owner, repo, branch, path } = cfg();
    hideMsg('authStatus');

    if (!token){
      showMsg('authStatus', 'error', 'Insere o token de acesso.');
      return;
    }

    // guardar (ou remover) o token localmente, conforme a checkbox
    if (document.getElementById('rememberToken').checked){
      localStorage.setItem(REMEMBER_KEY, token);
    } else {
      localStorage.removeItem(REMEMBER_KEY);
    }

    const loadBtn = document.getElementById('loadBtn');
    loadBtn.disabled = true;
    showMsg('authStatus', 'info', 'A carregar…');

    try{
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        }
      });

      if (res.status === 401){
        showMsg('authStatus', 'error', 'Token inválido ou sem permissões.');
        return;
      }
      if (res.status === 404){
        // ficheiro ainda não existe: começar com tudo disponível
        currentSha = null;
        currentStatus = {};
        renderItems();
        showMsg('authStatus', 'info', 'Ficheiro ainda não existe no repositório — será criado ao guardar.');
        document.getElementById('itemsPanel').style.display = 'block';
        return;
      }
      if (!res.ok){
        const err = await res.json().catch(() => ({}));
        showMsg('authStatus', 'error', `Erro ${res.status}: ${err.message || 'não foi possível carregar.'}`);
        return;
      }

      const data = await res.json();
      currentSha = data.sha;
      currentStatus = JSON.parse(b64DecodeUtf8(data.content));

      renderItems();
      document.getElementById('itemsPanel').style.display = 'block';
      showMsg('authStatus', 'success', 'Menu carregado.');
    }catch(err){
      showMsg('authStatus', 'error', 'Falha de ligação: ' + err.message);
    }finally{
      loadBtn.disabled = false;
    }
  }

  function renderItems(){
    const list = document.getElementById('itemsList');
    list.innerHTML = '';

    CATALOG.forEach(group => {
      const catDiv = document.createElement('div');
      catDiv.className = 'category';

      const title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = group.cat;
      catDiv.appendChild(title);

      group.items.forEach(([id, name]) => {
        const isAvailable = currentStatus[id] !== false; // default: disponível

        const row = document.createElement('div');
        row.className = 'item-row ' + (isAvailable ? 'is-available' : 'is-unavailable');
        row.dataset.id = id;

        row.innerHTML = `
          <span class="item-label">${name}</span>
          <span style="display:flex;align-items:center;gap:.7rem;">
            <span class="avail-label">${isAvailable ? 'Disponível' : 'Esgotado'}</span>
            <label class="switch">
              <input type="checkbox" ${isAvailable ? 'checked' : ''} onchange="toggleItem('${id}', this.checked, this)">
              <span class="slider"></span>
            </label>
          </span>
        `;
        catDiv.appendChild(row);
      });

      list.appendChild(catDiv);
    });
  }

  function toggleItem(id, isAvailable, checkboxEl){
    currentStatus[id] = isAvailable;
    const row = checkboxEl.closest('.item-row');
    row.classList.toggle('is-available', isAvailable);
    row.classList.toggle('is-unavailable', !isAvailable);
    row.querySelector('.avail-label').textContent = isAvailable ? 'Disponível' : 'Esgotado';
  }

  async function saveStatus(){
    const { token, owner, repo, branch, path } = cfg();
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    hideMsg('saveStatus');
    showMsg('saveStatus', 'info', 'A guardar alterações no GitHub…');

    try{
      const content = b64EncodeUtf8(JSON.stringify(currentStatus, null, 2));
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;

      const body = {
        message: 'Atualizar disponibilidade do menu',
        content,
        branch,
      };
      if (currentSha) body.sha = currentSha;

      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok){
        const err = await res.json().catch(() => ({}));
        if (res.status === 409){
          showMsg('saveStatus', 'error', 'O ficheiro foi alterado entretanto por outra pessoa. Carrega de novo e repete as alterações.');
        } else {
          showMsg('saveStatus', 'error', `Erro ${res.status}: ${err.message || 'não foi possível guardar.'}`);
        }
        return;
      }

      const data = await res.json();
      currentSha = data.content.sha;
      showMsg('saveStatus', 'success', 'Alterações guardadas! O site atualiza-se em cerca de 1 minuto.');
    }catch(err){
      showMsg('saveStatus', 'error', 'Falha de ligação: ' + err.message);
    }finally{
      saveBtn.disabled = false;
    }
  }
</script>

</body>
</html>
